name: Check release files
# the service worker must not be empty and the three version numbers must match, or phones stop updating
on:
  push:
    branches: [main]
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "$(wc -c < sw.js)" -gt 2000 || { echo "sw.js is empty or tiny"; exit 1; }
          sw=$(grep -o 'nook-[0-9.]*' sw.js | head -1 | sed 's/nook-//')
          app=$(grep -o 'APP_VERSION = "[0-9.]*"' app.js | grep -o '[0-9.]*[0-9]')
          notes=$(grep -m1 '^## ' CLAUDE_READ_THIS.txt | sed 's/^## //; s/ *!$//')
          echo "sw=$sw app=$app notes=$notes"
          test "$sw" = "$app" && test "$app" = "$notes"
