name: Deploy Supabase
# a push to main that touches supabase/ applies the new migrations and deploys the functions that changed
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cimyolsipjdpibzaebmx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.99.0
      - run: supabase link --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy the functions that changed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || echo "$base" | grep -qE '^0+$' || ! git cat-file -e "$base" 2>/dev/null; then base=HEAD~1; fi
          list=$(git diff --name-only "$base" HEAD -- supabase/functions | cut -d/ -f3 | sort -u)
          # shared code is not a function of its own: the functions that import it are deployed again
          if echo "$list" | grep -qx '_shared'; then list=$(printf '%s\n%s\n' "$list" "preview zenith-tick" | tr ' ' '\n' | grep -vx '_shared' | sort -u); fi
          for f in $list; do
            if [ -d "supabase/functions/$f" ]; then supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api; fi
          done
