plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'app.cash.paparazzi' }
android {
    namespace 'io.github.nookwebapp.native_ui'
    compileSdk 34
    defaultConfig { applicationId 'io.github.nookwebapp.nativeui'; minSdk 26; targetSdk 34; versionCode 33803; versionName '3.38.3' }
    // the release key never lives in the repository: NOOK_KS points at it and NOOK_KS_PASS opens it;
    // without them a release build is signed with the local debug key so it still installs for testing
    def ks = System.getenv('NOOK_KS')
    signingConfigs { if (ks) { release {
        storeFile file(ks); storePassword System.getenv('NOOK_KS_PASS'); keyAlias 'nook'; keyPassword System.getenv('NOOK_KS_PASS')
    } } }
    // a release built without the release key is only fit for testing: say so loudly, and never publish it
    if (!ks) project.gradle.taskGraph.whenReady { g -> if (g.allTasks.any { it.name.startsWith('assembleRelease') || it.name.startsWith('bundleRelease') }) throw new GradleException('NOOK_KS is not set: a release build must be signed with the release key, never the debug key.') }
    buildTypes { release { signingConfig ks ? signingConfigs.release : signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // the checks of lint that run on every release build only repeat what the compiler and the tests already say, and cost half a minute
    lint { checkReleaseBuilds false }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    // the live test runs the app's own server code on the JVM, where Android's calls answer with nothing
    testOptions { unitTests.returnDefaultValues = true; unitTests.all { it.environment('NOOK_LIVE', System.getenv('NOOK_LIVE') ?: '') } }
}
// one jsoup for the whole build: the extractor of NewPipe needs a recent one, the test tools bring an older one
configurations.all { resolutionStrategy.force 'org.jsoup:jsoup:1.17.2' }
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-gif:2.6.0'
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.gms:play-services-fido:20.1.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    // installs the baseline profile (app/src/main/baseline-prof.txt) when the app is installed outside Google Play
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    // YouTube: the extractor of NewPipe works out the address of a video (signatures, throttling) the way the site's own player does
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    // an H.264 clip (the clip X calls a gif) read frame by frame in plain Java, so it does not depend on the phone's own video decoder
    implementation 'org.jcodec:jcodec:0.2.5'
    // an MP3 encoder in plain Java (a port of LAME, LGPL): the sound of a video saved as an mp3
    implementation 'de.sciss:jump3r:1.0.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
